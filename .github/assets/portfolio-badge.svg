<svg xmlns="http://www.w3.org/2000/svg" width="104" height="20" role="img" aria-label="Portfolio: Visit">
  <title>Portfolio: Visit</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="104" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="60" height="20" fill="#374151"/>
    <rect x="60" width="44" height="20" fill="#E85C3B"/>
    <rect width="104" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <text x="310" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="500">Portfolio</text>
    <text x="310" y="140" transform="scale(.1)" fill="#fff" textLength="500">Portfolio</text>
    <text x="810" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="340">Visit</text>
    <text x="810" y="140" transform="scale(.1)" fill="#fff" textLength="340">Visit</text>
  </g>
</svg>
