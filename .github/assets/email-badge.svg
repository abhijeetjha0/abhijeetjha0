<svg xmlns="http://www.w3.org/2000/svg" width="104" height="20" role="img" aria-label="Email: Contact">
  <title>Email: Contact</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="104" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="48" height="20" fill="#374151"/>
    <rect x="48" width="56" height="20" fill="#10B981"/>
    <rect width="104" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <text x="250" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="360">Email</text>
    <text x="250" y="140" transform="scale(.1)" fill="#fff" textLength="360">Email</text>
    <text x="750" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="460">Contact</text>
    <text x="750" y="140" transform="scale(.1)" fill="#fff" textLength="460">Contact</text>
  </g>
</svg>
