<svg xmlns="http://www.w3.org/2000/svg" width="118" height="20" role="img" aria-label="LinkedIn: Connect">
  <title>LinkedIn: Connect</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="118" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="60" height="20" fill="#374151"/>
    <rect x="60" width="58" height="20" fill="#0A66C2"/>
    <rect width="118" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <text x="310" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="500">LinkedIn</text>
    <text x="310" y="140" transform="scale(.1)" fill="#fff" textLength="500">LinkedIn</text>
    <text x="880" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="480">Connect</text>
    <text x="880" y="140" transform="scale(.1)" fill="#fff" textLength="480">Connect</text>
  </g>
</svg>
